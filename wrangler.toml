name = "blox-fruit-fake"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV namespace đã có sẵn — thay "id" bằng ID thật của namespace GAME_DATA của bạn
# (xem trong Cloudflare Dashboard > Workers & Pages > KV, hoặc chạy `wrangler kv namespace list`)
[[kv_namespaces]]
binding = "GAME_DATA"
id = "79d7c1fbc0424415853d07e6de716ba6"

# Durable Object MỚI cho multiplayer realtime
[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

# Bắt buộc khi thêm Durable Object lần đầu vào một worker đã tồn tại.
# LƯU Ý: Cloudflare hiện yêu cầu gói Free dùng "new_sqlite_classes" (không phải "new_classes" cũ) —
# nếu dùng "new_classes" sẽ gặp lỗi code 10097 khi deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
